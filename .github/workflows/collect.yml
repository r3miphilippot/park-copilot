name: Collect wait times

on:
  schedule:
    # Every 15 min, off the round minutes: GitHub runs schedules "best effort" and the
    # :00/:15/:30/:45 slots are the most congested (runs get delayed or dropped).
    - cron: "7,22,37,52 * * * *"
  # Also triggered by an external free cron service (cron-job.org) through the GitHub API,
  # which is far more punctual than GitHub's own scheduler. Runs are idempotent anyway.
  workflow_dispatch:

# Never run two collections at the same time.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Exposed at job level so the keep-alive step can test it in its `if:`
      # (secrets cannot be referenced directly in conditions).
      API_URL: ${{ secrets.API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Only the small "collector" dependency group is installed, not the whole app.
      - name: Collect Queue-Times snapshots
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: uv run --frozen --no-dev --only-group collector python -m collector.collect

      # Pings the deployed API (free hosting sleeps after ~15 min idle). Runs even if the
      # collection failed, never fails the workflow, skipped when API_URL is unset.
      # A cold start can take a minute on the free tier, hence the long timeout.
      - name: Keep the API awake
        if: ${{ always() && env.API_URL != '' }}
        continue-on-error: true
        run: curl --fail --silent --show-error --max-time 90 "${API_URL%/}/health"
