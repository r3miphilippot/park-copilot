name: Evals

# Runs the golden set against the real LLM (frozen tool outputs). Manual, and on pull
# requests that touch the agent, the tools or the evals themselves.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Comma-separated case ids (empty = all)"
        required: false
        default: ""
  pull_request:
    paths:
      - "app/agent/**"
      - "app/tools/**"
      - "app/rag/**"
      - "evals/**"

permissions:
  contents: read

# One run at a time: they share the Groq free quota.
concurrency:
  group: evals
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Add the GROQ_API_KEY secret to run the evals"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The guide search runs for real: cache the embedding model between runs.
      - uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-${{ hashFiles('app/config.py') }}

      - run: uv sync --frozen

      - name: Run the golden set
        run: |
          ARGS="--fail-under 0.75"
          if [ -n "${{ inputs.cases }}" ]; then ARGS="$ARGS --cases ${{ inputs.cases }}"; fi
          uv run python -m evals.run_evals $ARGS

      # The Markdown report is also in the job summary (written by run_evals.py).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-report
          path: evals/reports/
