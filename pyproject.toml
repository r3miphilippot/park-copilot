[project]
name = "park-copilot"
version = "0.1.0"
description = "AI agent that plans your day at Disneyland Paris (LangGraph, RAG, MCP, FastAPI)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymongo>=4.8",
    "tzdata>=2024.1", # zoneinfo database (needed on Windows and slim Docker images)
]

[dependency-groups]
dev = [
    "mongomock>=4.2",
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]
# Minimal set installed by the 15-minute collector cron (keeps the job fast and light).
collector = [
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "pymongo>=4.8",
    "tzdata>=2024.1",
]

[tool.uv]
# This is an application, not a library: no wheel is built, modules run from the repo root.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs real external services (skipped when not configured)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
