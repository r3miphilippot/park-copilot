<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Park Copilot</title>
<meta name="description" content="Assistant IA pour organiser sa journée dans les deux parcs de Disneyland Paris.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b5bf0'/%3E%3Cpath d='M16 6l2.6 7.4L26 16l-7.4 2.6L16 26l-2.6-7.4L6 16l7.4-2.6z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f4fb;
    --bg-veil: rgba(245, 244, 251, .72);  /* sticky bars: lets the glow show through */
    --bg-glow-1: rgba(120, 104, 255, .16);
    --bg-glow-2: rgba(255, 184, 77, .14);
    --surface: #ffffff;
    --surface-2: #f0effa;
    --text: #1b1a2e;
    --muted: #6b6a85;
    --border: #e4e2f2;
    --primary: #5b5bf0;
    --primary-2: #8f5cf7;
    --gold: #e8a33d;
    --ok: #1f9d62;
    --err: #d9485f;
    --plan: #6d4ef2;
    --park: #139a74;
    --info: #2f7de1;
    --shadow: 0 1px 2px rgba(27, 26, 46, .05), 0 8px 24px rgba(27, 26, 46, .06);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0e1a;
      --bg-veil: rgba(13, 14, 26, .72);
      --bg-glow-1: rgba(111, 92, 255, .22);
      --bg-glow-2: rgba(255, 170, 60, .10);
      --surface: #161829;
      --surface-2: #1e2136;
      --text: #ecebf7;
      --muted: #9d9cb8;
      --border: #272a44;
      --primary: #7b7bff;
      --primary-2: #a77bff;
      --gold: #f2b552;
      --ok: #3ccf8e;
      --err: #ff6b81;
      --plan: #a58bff;
      --park: #3fd3a7;
      --info: #6aa8ff;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .25);
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }  /* `display: inline-flex` would otherwise win */
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 10% -10%, var(--bg-glow-1), transparent 60%),
      radial-gradient(700px 400px at 100% 0%, var(--bg-glow-2), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  .app { width: 100%; max-width: 820px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; padding: 0 16px; }

  /* ---------------------------------------------------------------- header */
  /* Full width and transparent at the top of the page, so the background glow is not cut by
     an opaque box; once the page scrolls, a blurred veil keeps the bar readable. */
  .top { position: sticky; top: 0; z-index: 5; border-bottom: 1px solid transparent;
         transition: background-color .2s ease, border-color .2s ease; }
  .top.scrolled { background: var(--bg-veil); border-bottom-color: var(--border);
                  -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); }
  .top-inner { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none;
          background: linear-gradient(135deg, var(--primary), var(--primary-2)); box-shadow: 0 6px 18px rgba(91, 91, 240, .35); }
  .brand { display: flex; flex-direction: column; line-height: 1.2; }
  .brand strong { font-size: 16px; letter-spacing: -.01em; }
  .brand span { font-size: 12.5px; color: var(--muted); }
  .top .spacer { flex: 1; }
  .ghost { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border);
           border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer; box-shadow: var(--shadow); }
  .ghost:hover { border-color: var(--primary); }
  body.embed .lang, body.embed .author { display: none; }
  body.embed .hero { padding-top: 12px; }
  .lang { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
          padding: 3px; box-shadow: var(--shadow); flex: none; }
  .lang button { border: 0; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 600;
                 padding: 5px 10px; border-radius: 999px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; }

  /* ---------------------------------------------------------------- welcome */
  .hero { padding: 36px 0 12px; animation: rise .5s ease both; }
  .hero h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.1; letter-spacing: -.03em; margin: 0 0 10px; }
  .hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--primary), var(--primary-2) 55%, var(--gold));
                -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: var(--muted); margin: 0 0 24px; max-width: 560px; }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  /* flex: a stretched <button> would otherwise centre its content vertically */
  .card { display: flex; flex-direction: column; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
          padding: 16px; cursor: pointer; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease; }
  .card:hover { transform: translateY(-2px); border-color: var(--primary); }
  .card .ico { font-size: 22px; line-height: 1; height: 24px; display: flex; align-items: center; }  /* emoji fonts differ in height */
  .card b { display: block; margin: 10px 0 4px; font-size: 14.5px; }
  .card span { color: var(--muted); font-size: 13px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; color: var(--muted); font-size: 12.5px; }
  .pills span { border: 1px dashed var(--border); border-radius: 999px; padding: 4px 10px; }

  /* ---------------------------------------------------------------- conversation */
  #log { display: flex; flex-direction: column; gap: 18px; padding: 8px 0 24px; flex: 1; }
  .turn { display: flex; gap: 10px; animation: rise .25s ease both; }
  .turn.user { justify-content: flex-end; }
  .turn.user .bubble { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff;
                       border: 0; border-bottom-right-radius: 6px; max-width: 80%; white-space: pre-wrap; }
  .avatar { width: 30px; height: 30px; border-radius: 10px; flex: none; display: grid; place-items: center; margin-top: 2px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2)); }
  .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            border-top-left-radius: 6px; padding: 12px 16px; box-shadow: var(--shadow); min-width: 0; max-width: 100%;
            overflow-wrap: anywhere; }
  .turn.bot .bubble { flex: 1; }

  .steps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .steps:empty { display: none; }
  .badge, .step { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px;
                  font-size: 12.5px; font-weight: 500; }
  .badge { color: #fff; }
  .badge.planning { background: var(--plan); }
  .badge.in_park { background: var(--park); }
  .badge.general { background: var(--info); }
  .step { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
  .step .state { width: 12px; height: 12px; display: inline-grid; place-items: center; font-size: 11px; }
  .step.run .state { border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
  .step.ok .state::before { content: "✓"; color: var(--ok); font-weight: 700; }
  .step.err .state::before { content: "!"; color: var(--err); font-weight: 700; }
  .step.err { border-color: color-mix(in srgb, var(--err) 40%, var(--border)); }

  .typing { display: inline-flex; gap: 4px; padding: 6px 0; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .4; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }

  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md h3 { font-size: 15px; margin: 16px 0 8px; letter-spacing: -.01em; }
  .md ul, .md ol:not(.timeline) { margin: 0 0 10px; padding-left: 20px; }
  .md li { margin: 3px 0; }
  .md code { background: var(--surface-2); border-radius: 6px; padding: 1px 6px; font-size: 13px; }
  .md a { color: var(--primary); }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }

  /* the day plan: "09:30 – Ride (detail)" lines become a timeline */
  .timeline { list-style: none; margin: 4px 0 12px; padding: 0; position: relative; }
  .timeline::before { content: ""; position: absolute; left: 27px; top: 10px; bottom: 10px; width: 2px;
                      background: linear-gradient(var(--primary), var(--primary-2), var(--gold)); opacity: .35; border-radius: 2px; }
  .timeline li { display: flex; gap: 14px; align-items: flex-start; padding: 6px 0; position: relative; }
  .timeline .t { flex: none; width: 56px; text-align: center; font-weight: 600; font-size: 12.5px; font-variant-numeric: tabular-nums;
                 background: var(--surface); border: 1.5px solid var(--primary); color: var(--primary); border-radius: 999px;
                 padding: 3px 0; position: relative; z-index: 1; }
  .timeline .c { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; flex: 1; min-width: 0; }
  .timeline .what { font-weight: 500; }
  .timeline .detail { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* export / share of a day plan */
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .action { display: inline-flex; align-items: center; gap: 5px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 500; cursor: pointer;
            transition: border-color .15s ease, color .15s ease; }
  .action:hover { border-color: var(--primary); }
  .action.ok { border-color: var(--ok); color: var(--ok); }
  .action.ko { border-color: var(--err); color: var(--err); }
  .shared-banner { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px; padding: 4px 10px;
                   border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--primary);
                   background: color-mix(in srgb, var(--primary) 12%, transparent); }

  .footnote { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); color: var(--muted); font-size: 12px; }
  .error { color: var(--err); }

  /* ---------------------------------------------------------------- composer */
  .composer { position: sticky; bottom: 0; z-index: 4;  /* above the timeline time pills (z-index 1) */
              padding: 10px 0 max(12px, env(safe-area-inset-bottom));
              background: linear-gradient(transparent, var(--bg) 30%); }
  .box { display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--border);
         border-radius: 20px; padding: 8px 8px 8px 16px; box-shadow: var(--shadow); transition: border-color .15s ease; }
  .box:focus-within { border-color: var(--primary); }
  textarea { flex: 1; resize: none; border: 0; outline: none; background: transparent; color: var(--text); font: inherit;
             padding: 8px 0; max-height: 160px; min-height: 24px; }
  textarea::placeholder { color: var(--muted); }
  .send { width: 40px; height: 40px; flex: none; border: 0; border-radius: 14px; cursor: pointer; display: grid; place-items: center;
          background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; transition: opacity .15s ease; }
  .send:disabled { opacity: .45; cursor: default; }
  .credits { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  .credits a { color: inherit; }
  .author { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 14px;
            margin-top: 6px; font-size: 12px; color: var(--muted); }
  .author a { display: inline-flex; align-items: center; gap: 5px; color: var(--text); text-decoration: none; opacity: .8; }
  .author a:hover { opacity: 1; color: var(--primary); }
  .author svg { width: 14px; height: 14px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: .9; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 720px) {
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 560px) {
    .cards { grid-template-columns: 1fr; gap: 8px; }
    /* compact cards on phones: icon on the left, six cards stay short */
    .card { display: grid; grid-template-columns: 28px minmax(0, 1fr); column-gap: 12px; align-items: center; padding: 12px 14px; }
    .card .ico { grid-row: span 2; }
    .card b { margin: 0 0 2px; }
    .hero { padding-top: 20px; }
    .turn.user .bubble { max-width: 90%; }
    .avatar { display: none; }
    .brand span { display: none; }
    .brand strong { white-space: nowrap; }
    .ghost { padding: 9px; }
    .ghost span { display: none; }  /* icon only: the label is in aria-label / title */
  }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="top-inner">
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z"/><circle cx="19" cy="19" r="1.6"/><circle cx="5" cy="4.5" r="1.1"/></svg>
    </div>
    <div class="brand">
      <strong>Park Copilot</strong>
      <span data-i18n="tagline">Assistant IA · Disneyland Paris, les deux parcs</span>
    </div>
    <div class="spacer"></div>
    <button class="ghost" id="reset" type="button" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="reset">Nouvelle conversation</span>
    </button>
    <div class="lang" role="group" aria-label="Langue / Language">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<div class="app">
  <main id="main">
    <section class="hero" id="welcome">
      <h1 data-i18n="title">Ta journée au parc,<br><em>planifiée en quelques secondes.</em></h1>
      <p data-i18n="intro">Park Copilot combine les temps d'attente habituels, les temps live, la météo heure par heure,
         les horaires officiels et un guide de visite pour te proposer un programme concret.</p>
      <div class="cards">
        <button class="card" type="button" data-card="plan">
          <div class="ico">📅</div><b></b><span></span>
        </button>
        <button class="card" type="button" data-card="parks">
          <div class="ico">🏰</div><b></b><span></span>
        </button>
        <button class="card" type="button" data-card="crowd">
          <div class="ico">👥</div><b></b><span></span>
        </button>
        <button class="card" type="button" data-card="now">
          <div class="ico">📍</div><b></b><span></span>
        </button>
        <button class="card" type="button" data-card="rain">
          <div class="ico">🌦️</div><b></b><span></span>
        </button>
        <button class="card" type="button" data-card="tips">
          <div class="ico">💡</div><b></b><span></span>
        </button>
      </div>
      <div class="pills" data-i18n="pills"></div>
    </section>

    <div id="log" aria-live="polite"></div>
  </main>

  <div class="composer">
    <form class="box" id="form">
      <textarea id="input" rows="1" maxlength="2000" aria-label="Message"></textarea>
      <button class="send" id="send" type="submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="credits" data-i18n="credits"></div>
    <div class="author" id="author"></div>
  </div>
</div>

<script>
// ------------------------------------------------------------------ translations (FR / EN)

const CREDITS = {
  fr: 'Temps d\'attente : <a href="https://queue-times.com/" target="_blank" rel="noopener">Powered by Queue-Times.com</a> (données non officielles) · Météo : <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> · Horaires : <a href="https://themeparks.wiki/" target="_blank" rel="noopener">ThemeParks.wiki</a> · Vacances : <a href="https://data.education.gouv.fr/" target="_blank" rel="noopener">data.education.gouv.fr</a> · Projet indépendant, non affilié aux parcs.',
  en: 'Wait times: <a href="https://queue-times.com/" target="_blank" rel="noopener">Powered by Queue-Times.com</a> (unofficial data) · Weather: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> · Hours: <a href="https://themeparks.wiki/" target="_blank" rel="noopener">ThemeParks.wiki</a> · Holidays: <a href="https://data.education.gouv.fr/" target="_blank" rel="noopener">data.education.gouv.fr</a> · Independent project, not affiliated with the parks.',
};
const I18N = {

    placeholder: "Pose ta question… (ex : on vient mardi, par quoi commencer ?)",

      get_weather: ["🌦️", "Météo"],
      get_park_hours: ["🕘", "Horaires"],
      list_rides: ["🎢", "Attractions"],
      plan_day: ["🗺️", "Programme"],
      get_crowd_calendar: ["👥", "Affluence"],
      search_park_guide: ["📖", "Guide"],
    },
    plan: {
      group: "Exporter le programme",
      calendar: "Ajouter au calendrier",
      downloaded: "Fichier .ics téléchargé",
      share: "Partager",
      linkCopied: "Lien copié",
      copy: "Copier le texte",
      copied: "Texte copié",
      copyFailed: "Copie impossible",
      shared: "Programme partagé",
      shareTitle: "Mon programme Park Copilot",
    },
    modes: { planning: ["📅", "Planification"], in_park: ["📍", "Au parc"], general: ["💬", "Question générale"] },
    tool: n => `${n} outil${n > 1 ? "s" : ""}`,
    decimal: ",",
    offline: "Impossible de joindre le serveur. Réessaie dans un instant.",
    error: "Erreur",
  },
  en: {
    tagline: "AI assistant · Disneyland Paris, both parks",
    reset: "New conversation",
    title: "Your day at the park,<br><em>planned in seconds.</em>",
    intro: "Park Copilot combines usual wait times, live waits, the hourly weather, the official opening hours and a visit guide to build you a concrete plan.",
    pills: "<span>Live waits</span><span>Wait history</span><span>Hourly weather</span><span>Hours and shows</span><span>Visit guide</span>",
    credits: CREDITS.en,
    placeholder: "Ask anything… (e.g. we're coming on Tuesday, where should we start?)",

              "We only have one day, can we do both parks? Make us a plan for Saturday."],
      crowd: ["Which day to come?", "Expected crowds from history and holidays",
              "We're hesitating between several days in December, which day should we come to avoid the crowds?"],

             "Will it rain tomorrow? Which rides should we do at Disney Adventure World?"],

// ------------------------------------------------------------------ markdown (safe subset)

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function inline(s, links = true) {  // s is already escaped
  s = s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
  return links ? s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>') : s;
}

// "09:30 – Big Thunder Mountain (≈ 15 min, 6 jours de données)" -> timeline item; also
// "- **09:30 – ...**" and "**09:30** – ..." as LLMs write them.
const TIME_LINE = /^(?:[-*•]\s*)?(?:\*\*)?(\d{1,2})\s*[:h]\s*(\d{2})(?:\*\*)?\s*[–—-]\s*(.+)$/;
const TABLE_SEPARATOR = /^\|?\s*:?-{3,}/;

// Markdown lines, trimmed, without table separators, a fully bold line unwrapped.
function mdLines(src) {
  return src.replace(/\r/g, "").split("\n").map(raw => raw.trim())
    .map(line => TABLE_SEPARATOR.test(line) ? null : line.replace(/^\*\*(.+)\*\*$/, "$1"));
}

// A plan step: { time: "09:30", what: "Big Thunder Mountain", detail: "≈ 15 min" }, or null.
function timedStep(line) {
  const m = TIME_LINE.exec(line);
  if (!m) return null;
  let what = m[3].replace(/\*\*/g, ""), detail = "";
  const p = /^(.*?)\s*\(([^()]*(?:\([^()]*\)[^()]*)*)\)\s*$/.exec(what);
  if (p && p[1]) { what = p[1]; detail = p[2]; }
  return { time: `${m[1].padStart(2, "0")}:${m[2]}`, what, detail };
}

function planSteps(src) {
  return mdLines(src).filter(Boolean).map(timedStep).filter(Boolean);
}

// Shared plans come from a URL anyone can craft: their links are shown as plain text.
function renderMarkdown(src, { links = true } = {}) {
  const fmt = s => inline(escapeHtml(s), links);
  let html = "", list = null;
  const close = () => { if (list) { html += `</${list === "timeline" ? "ol" : list}>`; list = null; } };
  const open = kind => {
    if (list === kind) return;
    close();
    html += kind === "timeline" ? '<ol class="timeline">' : `<${kind}>`;
    list = kind;
  };
  for (const line of mdLines(src)) {
    if (line === null) continue;                           // table separator rows
    if (!line) { close(); continue; }
    let m, step;
    if ((step = timedStep(line))) {
      open("timeline");
      html += `<li><span class="t">${step.time}</span><div class="c">`
            + `<div class="what">${fmt(step.what)}</div>`
            + (step.detail ? `<div class="detail">${fmt(step.detail)}</div>` : "")
            + "</div></li>";
    } else if ((m = /^#{1,6}\s+(.+)$/.exec(line))) {
      close(); html += `<h3>${fmt(m[1])}</h3>`;
    } else if ((m = /^[-*•]\s+(.+)$/.exec(line))) {
      open("ul"); html += `<li>${fmt(m[1])}</li>`;
    } else if ((m = /^\d+[.)]\s+(.+)$/.exec(line))) {
      open("ol"); html += `<li>${fmt(m[1])}</li>`;
    } else if (/^(-{3,}|\*{3,})$/.test(line)) {
      close(); html += "<hr>";
    } else {
      close(); html += `<p>${fmt(line.replace(/^\|\s*|\s*\|$/g, "").replace(/\s*\|\s*/g, " · "))}</p>`;
    }
  }
  close();
  return html;
}

const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;
const MAX_SHARED_BYTES = 64 * 1024;  // a decoded shared plan; also stops "zip bombs" in the URL

function todayParis() {
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit",
  }).formatToParts(new Date()).map(p => [p.type, p.value]));
  return `${parts.year}-${parts.month}-${parts.day}`;
}

function formatDate(iso) {
  return new Intl.DateTimeFormat(lang === "fr" ? "fr-FR" : "en-GB", {
    weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC",
  }).format(new Date(`${iso}T12:00:00Z`));
}

// Markdown -> plain text (calendar titles, copied text).
function plain(s) {
  return s
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, "$1 ($2)")
    .replace(/\*\*|`/g, "")
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, "$1$2");
}

function planAsText(text, date) {
  const body = mdLines(text).filter(line => line !== null)
    .map(line => plain(line.replace(/^#{1,6}\s+/, "").replace(/^[-*•]\s+/, "• ")))
    .join("\n").replace(/\n{3,}/g, "\n\n").trim();
  return `Park Copilot${date ? " · " + formatDate(date) : ""}\n\n${body}\n`;
}

// --- iCalendar (RFC 5545): local times in Europe/Paris, with its time zone definition.
const ICS_TIMEZONE = [
  "BEGIN:VTIMEZONE", "TZID:Europe/Paris",
  "BEGIN:DAYLIGHT", "TZOFFSETFROM:+0100", "TZOFFSETTO:+0200", "TZNAME:CEST",
  "DTSTART:19700329T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU", "END:DAYLIGHT",
  "BEGIN:STANDARD", "TZOFFSETFROM:+0200", "TZOFFSETTO:+0100", "TZNAME:CET",
  "DTSTART:19701025T030000", "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU", "END:STANDARD",
  "END:VTIMEZONE",
];
const icsText = s => s.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
const pad2 = n => String(n).padStart(2, "0");

function icsFold(line) {  // lines of at most 75 bytes, continued with a leading space
  const encoder = new TextEncoder(), out = [];
  let current = "", size = 0;
  for (const ch of line) {
    const bytes = encoder.encode(ch).length;
    if (size + bytes > (out.length ? 74 : 75)) { out.push(current); current = ""; size = 0; }
    current += ch; size += bytes;
  }
  out.push(current);
  return out.join("\r\n ");
}

function icsLocal(isoDate, minutes) {  // wall-clock time, may roll over to the next day
  const [y, m, d] = isoDate.split("-").map(Number);
  const at = new Date(Date.UTC(y, m - 1, d, 0, minutes));
  return `${at.getUTCFullYear()}${pad2(at.getUTCMonth() + 1)}${pad2(at.getUTCDate())}`
       + `T${pad2(at.getUTCHours())}${pad2(at.getUTCMinutes())}00`;
}

function buildIcs(steps, date) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const uid = (window.crypto?.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2));
  const minutes = s => Number(s.time.slice(0, 2)) * 60 + Number(s.time.slice(3));
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Park Copilot//Day plan//EN",
                 "CALSCALE:GREGORIAN", "METHOD:PUBLISH", ...ICS_TIMEZONE];
  steps.forEach((step, i) => {
    const start = minutes(step), next = steps[i + 1] ? minutes(steps[i + 1]) : null;
    const end = next !== null && next > start ? next : start + 30;
    lines.push("BEGIN:VEVENT", `UID:${uid}-${i}@park-copilot`, `DTSTAMP:${stamp}`,
               `DTSTART;TZID=Europe/Paris:${icsLocal(date, start)}`,
               `DTEND;TZID=Europe/Paris:${icsLocal(date, end)}`,
               `SUMMARY:${icsText(plain(step.what))}`);
    if (step.detail) lines.push(`DESCRIPTION:${icsText(plain(step.detail))}`);
    lines.push("LOCATION:Disneyland Paris", "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.map(icsFold).join("\r\n") + "\r\n";
}

function download(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const link = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  const area = Object.assign(document.createElement("textarea"), { value: text });  // http, old browsers
  area.setAttribute("readonly", "");
  area.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.append(area);
  area.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (_) {}
  area.remove();
  return ok;
}

// --- share link: #plan=z<deflate-raw, base64url> (or r<base64url> without CompressionStream).
// The plan stays in the URL fragment: it is never sent to the server.
function toBase64Url(bytes) {
  let binary = "";
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function fromBase64Url(text) {
  const binary = atob(text.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((text.length + 3) % 4));
  return Uint8Array.from(binary, c => c.charCodeAt(0));
}

async function pipeBytes(bytes, transform, limit = Infinity) {
  const reader = new Blob([bytes]).stream().pipeThrough(transform).getReader();
  const chunks = [];
  let size = 0;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    size += value.length;
    if (size > limit) { reader.cancel(); throw new Error("too large"); }
    chunks.push(value);
  }
  const out = new Uint8Array(size);
  let offset = 0;
  for (const chunk of chunks) { out.set(chunk, offset); offset += chunk.length; }
  return out;
}

async function encodePlan(text, date) {
  const bytes = new TextEncoder().encode(JSON.stringify({ d: date, t: text }));
  try {
    return "z" + toBase64Url(await pipeBytes(bytes, new CompressionStream("deflate-raw")));
  } catch (_) {
    return "r" + toBase64Url(bytes);
  }
}

async function decodePlan(payload) {
  const bytes = fromBase64Url(payload.slice(1));
  let raw;
  if (payload[0] === "z") raw = await pipeBytes(bytes, new DecompressionStream("deflate-raw"), MAX_SHARED_BYTES);
  else if (payload[0] === "r" && bytes.length <= MAX_SHARED_BYTES) raw = bytes;
  else throw new Error("unknown payload");
  const data = JSON.parse(new TextDecoder().decode(raw));
  if (typeof data?.t !== "string") throw new Error("no plan");
  return { text: data.t, date: ISO_DATE.test(data.d) ? data.d : null };
}

function flash(button, label, ok = true) {
  clearTimeout(button.flashTimer);
  button.textContent = `${ok ? "✓" : "⚠️"} ${label}`;
  button.classList.toggle("ok", ok);
  button.classList.toggle("ko", !ok);
  button.flashTimer = setTimeout(() => {
    button.textContent = button.dataset.label;
    button.classList.remove("ok", "ko");
  }, 2200);
}

// Calendar / share / copy buttons under a day plan.
function planActions(text, date) {
  const steps = planSteps(text);
  const day = date || todayParis();
  const link = encodePlan(text, date)  // ready before the click: browsers want share/copy in the gesture
    .then(payload => `${location.origin}${location.pathname}#plan=${payload}`);
  const row = el("div", "actions");
  row.setAttribute("role", "group");
  row.setAttribute("aria-label", t().plan.group);
  const add = (icon, label, onClick) => {
    const button = el("button", "action");
    button.type = "button";
    button.dataset.label = button.textContent = `${icon} ${label}`;
    button.addEventListener("click", () => onClick(button));
    row.append(button);
  };
  add("📅", t().plan.calendar, button => {
    download(`park-copilot-${day}.ics`, buildIcs(steps, day), "text/calendar;charset=utf-8");
    flash(button, t().plan.downloaded);
  });
  add("🔗", t().plan.share, async button => {
    const url = await link;
    if (navigator.share && window.matchMedia?.("(pointer: coarse)").matches) {  // phones: share sheet
      try { await navigator.share({ title: t().plan.shareTitle, url }); return; }
      catch (err) { if (err?.name === "AbortError") return; }
    }
    const ok = await copyText(url);
    flash(button, ok ? t().plan.linkCopied : t().plan.copyFailed, ok);
  });
  add("📋", t().plan.copy, async button => {
    const ok = await copyText(planAsText(text, date));
    flash(button, ok ? t().plan.copied : t().plan.copyFailed, ok);
  });
  return row;
}

// A plan opened from a share link: shown read-only; asking a question starts a new conversation.
async function openSharedPlan() {
  const match = /^#plan=([zr][A-Za-z0-9_-]+)$/.exec(location.hash);
  if (!match) return;
  let shared;
  try { shared = await decodePlan(match[1]); } catch (_) { return; }  // broken link: normal welcome
  if (!shared.text.trim()) return;
  welcome.hidden = true;
  reset.hidden = false;
  const bot = el("div", "turn bot");
  const bubble = el("div", "bubble");
  const banner = el("div", "shared-banner");
  banner.textContent = `🔗 ${t().plan.shared}${shared.date ? " · " + formatDate(shared.date) : ""}`;
  bubble.append(banner, el("div", "md", renderMarkdown(shared.text, { links: false })));
  if (planSteps(shared.text).length) bubble.append(planActions(shared.text, shared.date));
  bot.append(el("div", "avatar", AVATAR), bubble);
  log.append(bot);
}

// ------------------------------------------------------------------ chat

async function ask(message) {
  startConversation();
  const user = el("div", "turn user");
  user.append(el("div", "bubble"));
  user.firstChild.textContent = message;
  log.append(user);

  const bot = el("div", "turn bot");
  const bubble = el("div", "bubble");
  const steps = el("div", "steps");
  const answer = el("div", "md");
  const typing = el("div", "typing", "<span></span><span></span><span></span>");
  bubble.append(steps, answer, typing);
  bot.append(el("div", "avatar", AVATAR), bubble);
  log.append(bot);
  scrollDown();

  send.disabled = true;
  let text = "", planDate = null;
  const running = {};
  try {
    const response = await fetch("chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(threadId ? { message, lang, thread_id: threadId } : { message, lang }),
    });
    if (!response.ok || !response.body) throw new Error("HTTP " + response.status);
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buffer.indexOf("\n\n")) >= 0) {        // one SSE event per blank line
        const raw = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);
        const event = /^event: (.*)$/m.exec(raw)?.[1];
        const data = JSON.parse(/^data: (.*)$/m.exec(raw)?.[1] || "{}");
        handle(event, data);
      }
    }
  } catch (err) {
    typing.remove();
    answer.insertAdjacentHTML("beforeend", `<p class="error">${t().offline}</p>`);
  } finally {
    typing.remove();
    send.disabled = false;
    input.focus();
  }

  function handle(event, data) {
    if (event === "mode") {
      const [icon, label] = t().modes[data.mode] || ["", data.mode];
      steps.append(el("span", `badge ${data.mode}`, `${icon} ${label}`));
      if (ISO_DATE.test(data.target_date || "")) planDate = data.target_date;
    } else if (event === "tool_start") {
      const [icon, label] = t().tools[data.name] || ["🔧", data.name];
      running[data.id] = el("span", "step run", `<span class="state"></span>${icon} ${label}`);
      steps.append(running[data.id]);
    } else if (event === "tool_end" && running[data.id]) {
      running[data.id].className = "step " + (data.ok ? "ok" : "err");
    } else if (event === "token") {
      text += data.text;
      answer.innerHTML = renderMarkdown(text);
    } else if (event === "done") {
      if (data.thread_id) {
        threadId = data.thread_id;
        try { sessionStorage.setItem("thread_id", threadId); } catch (_) {}
      }
      // A day plan (at least two timed steps): calendar, share link, copy.
      if (planSteps(text).length >= 2) answer.after(planActions(text, planDate));
      if (data.latency_ms !== undefined) {
        const parts = [];
        if (data.mode && t().modes[data.mode]) parts.push(t().modes[data.mode][1]);
        if (data.tools?.length) parts.push(t().tool(data.tools.length));
        parts.push(`${(data.latency_ms / 1000).toFixed(1).replace(".", t().decimal)} s`);
        bubble.append(el("div", "footnote", parts.join(" · ")));
      }
    } else if (event === "error") {
      answer.insertAdjacentHTML("beforeend", `<p class="error">⚠️ ${escapeHtml(data.message || t().error)}</p>`);
    }
    if (event === "token" || event === "error") typing.remove();
    scrollDown();
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message || send.disabled) return;
  input.value = "";
  autoGrow();
  ask(message);
});
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
document.querySelectorAll(".card").forEach(card => card.addEventListener("click", () => ask(card.dataset.q)));
const topBar = $("top");
const onScroll = () => topBar.classList.toggle("scrolled", window.scrollY > 4);
window.addEventListener("scroll", onScroll, { passive: true });
onScroll();
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));
applyLang(lang);
window.addEventListener("hashchange", openSharedPlan);
openSharedPlan();
</script>
</body>
