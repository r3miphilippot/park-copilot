# Golden set: questions with a simulated date/time, frozen tool outputs and expectations.
#
#   now:       simulated current time, Paris (2026-07-14 is a Tuesday, 2026-07-18 a Saturday)
#   lang:      language picked in the interface (omitted = the question's language)
#   fixtures:  frozen output per tool (evals/fixtures/<name>.json), or "error:<message>" to
#              simulate a failure. For get_typical_wait, a mapping per park is allowed.
#              search_park_guide always runs for real (local RAG, deterministic).
#   expect:    mode, target date, tools that must / must not / may be called, argument checks
#   checks:    content assertions (the "no invented wait time" check always runs)
#   judge:     planning quality graded by another LLM with a simple rubric

# --------------------------------------------------------------------------- planning

- id: plan_saturday_kids
  category: planning
  now: "2026-07-14T10:30"
  question: "Je viens samedi au Disneyland Park avec mes enfants de 5 et 9 ans, tu me fais un programme ?"
  fixtures:
    get_weather: weather_2026-07-18_dry
    get_typical_wait: typical_saturday_disneyland_park
  expect:
    mode: planning
    date: "2026-07-18"
    tools: [get_weather, get_typical_wait]
    forbid_tools: [get_live_wait_times, compare_live_vs_typical]
    args:
      get_weather: {date: "2026-07-18"}
      get_typical_wait: {weekday: 5}
  checks:
    mentions_days_of_data: true
    min_timed_steps: 10
    mentions_evening_show: true
    must_not_include: [FastPass, Premier Access, Illuminations, coin lecture]
  judge: true

